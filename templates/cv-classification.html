<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="Smart CV Extractor, AI Resume, Resume Analysis, CV Extraction, Resume Builder" />
  <meta name="description" content="Welcome to Smart CV Extractor – your AI-powered solution for resume evaluation, analysis, and creation." />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

  <title>JOBFIT</title>

  <style>
    /* ضمان ملء الشاشة بالكامل */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* جعل المحتوى الرئيسي يحتل كامل الارتفاع بدون أن يلتصق بالهيدر */
    .main-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ضبط قسم التصنيف ليكون في المنتصف */
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ضمان بقاء الفوتر في الأسفل دائمًا */
    footer {
      background-color: #f8f9fa;
      padding: 10px 0;
      text-align: center;
    }

    /* تأثير التحميل */
    #loading {
      display: none;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #007bff;
    }
  </style>

</head>
<body oncontextmenu="return false">

  <div class="main-container">
  <!-- navbar starts -->
  <header>
    <a href="/" class="logo"><i class="fas fa-robot"></i> JOBFIT</a>
    <div id="menu" class="fas fa-bars"></div>
    <nav class="navbar">
      <ul>
        <li><a class="active" href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>
  <!-- navbar ends -->

    <!-- Classification Section - في منتصف الصفحة -->
    <div class="content">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card shadow p-4">
              <h3 class="text-center mb-4">Resume Classifier</h3>
              <p class="text-center text-muted">Enter your resume text below and click "Classify Resume" to get the predicted category.</p>
              
              <!-- نموذج لإرسال نص السيرة الذاتية -->
              <form id="resumeForm" action="/cv-classification" method="POST">
                <div class="mb-3">
                  <label for="resumeText" class="form-label"><strong>Enter Your Resume Text:</strong></label>

                <textarea class="form-control" id="resumeText" name="resumeText" rows="6" required>{{ request.form['resumeText'] if request.form['resumeText'] else '' }}</textarea>
                </div>   <!-- حقل لإدخال نص السيرة الذاتية -->
                <div class="text-center">
                  <button type="submit" class="btn btn-primary"> \\ زر الارسال
                    <i class="fas fa-search"></i> //تصنيف السيرة
                  </button>
                </div>
              </form>

              <!--  عند الضغط على "Classify Resume"، يظهر عنصر التحميل Processing...تأثير تحميل -->
              <div id="loading" class="mt-3">
                <i class="fas fa-spinner fa-spin"></i> Processing...
              </div>

              <!-- Display classification result -->
              {% if prediction %}
              <div class="alert alert-success mt-4 text-center">
                <strong>Predicted Category:</strong> {{ prediction }}
              </div>
              {% endif %}

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer ثابت في الأسفل -->
    <footer>
      <p>JOBFIT © 2025</p>
    </footer>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById("resumeForm").addEventListener("submit", function() {
      document.getElementById("loading").style.display = "block";
    });
  </script>

</body>
</html>
